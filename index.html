<!DOCTYPE html>

<html>

<head>

<title>AI Tools Hub</title>

<style>

body{

background:#000;

color:white;

font-family:Arial;

text-align:center;

}

.container{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

padding:15px;

}

.box{

background:#222;

padding:15px;

border-radius:15px;

}

button{

padding:8px;

border-radius:8px;

margin:4px;

}

input,textarea{

width:90%;

padding:8px;

border-radius:8px;

}

textarea{

height:100px;

}

#essay{

height:200px;

overflow:auto;

}

</style>

</head>

<body>

<h1>🚀 AI Tools Hub</h1>

<div class="container">

<div class="box">

<h3>⏱️ Stopwatch</h3>

<h4 id="time">00:00:000</h4>

<button onclick="start()">Start</button>

<button onclick="pause()">Pause</button>

<button onclick="reset()">Reset</button>

</div>

<div class="box">

<h3>🔐 Password</h3>

<button onclick="password()">Generate</button>

<p id="pass"></p>

</div>

<div class="box">

<h3>📝 Essay Generator</h3>

<input id="topic" placeholder="Essay topic">

<br>

<input id="words" placeholder="Words (max 3000)">

<br>

<button onclick="essay()">Create</button>

<textarea id="essay" readonly></textarea>

</div>

<div class="box">

<h3>🤖 AI Humanizer</h3>

<textarea id="text" placeholder="Paste text"></textarea>

<button onclick="humanize()">Humanize</button>

<p id="human"></p>

</div>

</div>

<script>

// STOPWATCH

let startTime;

let elapsed=0;

let timer=null;

function start(){

if(!timer){

startTime=Date.now()-elapsed;

timer=setInterval(()=>{

elapsed=Date.now()-startTime;

let ms=elapsed%1000;

let sec=Math.floor(elapsed/1000)%60;

let min=Math.floor(elapsed/60000);

time.innerHTML=

String(min).padStart(2,"0")+":"+

String(sec).padStart(2,"0")+":"+

String(ms).padStart(3,"0");

},10);

}

}

function pause(){

clearInterval(timer);

timer=null;

}

function reset(){

pause();

elapsed=0;

time.innerHTML="00:00:000";

}

// PASSWORD

function password(){

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890!@#$%";

let p="";

for(let i=0;i<16;i++){

p+=chars[Math.floor(Math.random()*chars.length)];

}

pass.innerHTML=p;

}

function humanize(){

let text=document.getElementById("text").value;

"Humanized version will appear here when AI is connected.";

}

</script>

</body>

</html>
