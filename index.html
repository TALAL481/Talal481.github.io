<!DOCTYPE html>

<html>

<head>

<title>AI Tools Hub</title>

<style>

body{

background:black;

color:white;

font-family:Arial;

text-align:center;

}

.container{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

padding:15px;

}

.box{

background:#222;

padding:15px;

border-radius:15px;

}

button{

padding:8px;

margin:4px;

border-radius:8px;

}

input,textarea{

width:90%;

padding:8px;

border-radius:8px;

}

textarea{

height:100px;

}

</style>

</head>

<body>

<h1>🚀 AI Tools Hub</h1>

<div class="box">

<h3>🎨 Change Background</h3>

<input type="color" onchange="changeBG(this.value)">

</div>

<div class="container">

<div class="box">

<h3>⏱️ Stopwatch</h3>

<h2 id="time">00:00:000</h2>

<button onclick="start()">Start</button>

<button onclick="pause()">Pause</button>

<button onclick="reset()">Reset</button>

</div>

<div class="box">

<h3>🔐 Password Generator</h3>

<button onclick="makePassword()">Generate</button>

<p id="password"></p>

</div>

<div class="box">

<h3>📝 Essay Generator</h3>

<input id="topic" placeholder="Essay topic">

<br><br>

<input id="amount" placeholder="Words (max 3000)">

<br><br>

<button onclick="makeEssay()">Generate</button>

<textarea id="essay"></textarea>

</div>

<div class="box">

<h3>🤖 AI Humanizer</h3>

<textarea id="inputText" placeholder="Paste text here"></textarea>

<button onclick="humanize()">Fix Text</button>

<textarea id="outputText"></textarea>

</div>

</div>

<script>

// BACKGROUND

function changeBG(color){

document.body.style.background=color;

}

// STOPWATCH

let elapsed=0;

let startTime;

let timer=null;

function start(){

if(timer==null){

startTime=Date.now()-elapsed;

timer=setInterval(()=>{

elapsed=Date.now()-startTime;

let ms=elapsed%1000;

let sec=Math.floor(elapsed/1000)%60;

let min=Math.floor(elapsed/60000);

document.getElementById("time").innerHTML=

String(min).padStart(2,"0")+":"+

String(sec).padStart(2,"0")+":"+

String(ms).padStart(3,"0");

},10);

}

}

function pause(){

clearInterval(timer);

timer=null;

}

function reset(){

pause();

elapsed=0;

time.innerHTML="00:00:000";

}

// PASSWORD

function makePassword(){

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890!@#$%";

let result="";

for(let i=0;i<16;i++){

result+=chars[Math.floor(Math.random()*chars.length)];

}

password.innerHTML=result;

}

// ESSAY

function makeEssay(){

let topic=document.getElementById("topic").value;

let words=Number(document.getElementById("amount").value);

if(words>3000) words=3000;

let text="";

while(text.split(" ").length<words){

text+=topic+" is an interesting subject that has many important details. Learning about this topic helps people understand new ideas and discover more information about the world. ";

}

document.getElementById("essay").value=text;

}

// HUMANIZER

function humanize(){

let text=document.getElementById("inputText").value;

document.getElementById("outputText").value=

"Humanized version will appear here when AI is connected.\n\n"+text;

}

</script>

</body>

</html>
