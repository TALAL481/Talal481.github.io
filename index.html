<!DOCTYPE html>

<html>

<head>

<title>Useful Tools Hub</title>

<style>

body {

  font-family: Arial, sans-serif;

  text-align: center;

  background: #111;

  color: white;

}

h1 {

  margin-top: 40px;

}

.tool {

  background: #222;

  margin: 20px;

  padding: 20px;

  border-radius: 15px;

}

button {

  padding: 10px 20px;

  border-radius: 10px;

  cursor: pointer;

}

</style>

</head>

<body>

<h1>Useful Tools Hub 🚀</h1>

<div class="tool">

<h2>⏱️ Stopwatch</h2>

<h3 id="time">00:00:000</h3>

<button onclick="start()">Start</button>

<button onclick="pause()">Pause</button>

<button onclick="reset()">Reset</button>
  
</div>

<div class="tool">

<h2>🧮 Calculator</h2>

<button>Open Calculator</button>

</div>

<div class="tool">

<h2>✅ To-Do List</h2>

<button>Open To-Do List</button>

</div>

<div class="tool">

<h2>🔐 Password Generator</h2>

<button>Open Password Generator</button>

</div>
<script>

let seconds = 0;

let timer;

function start() {

  if (!timer) {

    timer = setInterval(() => {

      seconds++;

      document.getElementById("time").innerHTML = seconds + "s";

    }, 1000);

  }

}

function pause() {

  clearInterval(timer);
let milliseconds = 0;

let timer = null;

function start() {

  if (timer === null) {

    timer = setInterval(function() {

      milliseconds++;

      let ms = milliseconds % 1000;

      let totalSeconds = Math.floor(milliseconds / 1000);

      let seconds = totalSeconds % 60;

      let minutes = Math.floor(totalSeconds / 60);

      document.getElementById("time").innerHTML =

        String(minutes).padStart(2, "0") + ":" +

        String(seconds).padStart(2, "0") + ":" +

        String(ms).padStart(3, "0");

    }, 1);

  }

}

function pause() {

  clearInterval(timer);

  timer = null;

}

function reset() {

  pause();

  milliseconds = 0;

  document.getElementById("time").innerHTML = "00:00:000";

}
  timer = null;

}

function reset() {

  pause();

  seconds = 0;

  document.getElementById("time").innerHTML = "0";

}

</script>

</body>

</html>
