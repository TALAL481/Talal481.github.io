<!DOCTYPE html>

<html>

<head>

<title>AI Tools 🚀</title>

<style>

body {

  background: black;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

  margin: 0;

}

h1 {

  margin: 25px;

}

.container {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 15px;

  padding: 20px;

}

.card {

  background: #111;

  border-radius: 15px;

  padding: 20px;

  border: 1px solid #333;

}

button {

  padding: 10px;

  margin: 5px;

  border-radius: 10px;

  border: none;

  cursor: pointer;

}

input, textarea {

  width: 90%;

  padding: 10px;

  margin: 8px;

  border-radius: 10px;

  border: none;

}

#time {

  font-size: 30px;

}

</style>

</head>

<body>

<h1>AI Tools 🚀</h1>

<div class="container">

<div class="card">

<h2>⏱ Stopwatch</h2>

<div id="time">00:00:00.000</div>

<button onclick="startTimer()">Start</button>

<button onclick="stopTimer()">Stop</button>

<button onclick="resetTimer()">Reset</button>

</div>

<div class="card">

<h2>🔐 Password Generator</h2>

<p id="password">---</p>

<button onclick="generatePassword()">Generate</button>

</div>
<div class="card">

<h2>📝 Essay Generator</h2>

<input id="topic" placeholder="Enter essay topic">

<input id="words" placeholder="Word count">

<button onclick="generateEssay()">Generate Essay</button>

<textarea id="essayResult" rows="8" placeholder="Essay appears here"></textarea>

</div>

<div class="card">

<h2>🤖 AI Humanizer</h2>

<textarea id="humanText" rows="8" placeholder="Paste text here"></textarea>

<button onclick="humanize()">Humanize</button>

<textarea id="humanResult" rows="8" placeholder="Result appears here"></textarea>

</div>

<div class="card">

<h2>🎨 Change Background</h2>

<input type="color" id="color">

<button onclick="changeColor()">Change</button>

</div>

</div>

<script>

let startTime;

let timer;

let running = false;

let elapsed = 0;

function updateTime(){

let now = Date.now() - startTime + elapsed;

let ms = now % 1000;

let seconds = Math.floor(now / 1000) % 60;

let minutes = Math.floor(now / 60000) % 60;

let hours = Math.floor(now / 3600000);

document.getElementById("time").innerHTML =

String(hours).padStart(2,"0") + ":" +

String(minutes).padStart(2,"0") + ":" +

String(seconds).padStart(2,"0") + "." +

String(ms).padStart(3,"0");

}

function startTimer(){

if(!running){

startTime = Date.now();

timer = setInterval(updateTime,10);

running = true;

}

}

function stopTimer(){

if(running){

clearInterval(timer);

elapsed += Date.now() - startTime;

running = false;

}

}

function resetTimer(){

clearInterval(timer);

running = false;

elapsed = 0;

document.getElementById("time").innerHTML =

"00:00:00.000";

}

function generatePassword(){

let chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

let password = "";

for(let i=0;i<16;i++){

password += chars[Math.floor(Math.random()*chars.length)];

}

document.getElementById("password").innerHTML = password;

}
async function generateEssay(){

let topic = document.getElementById("topic").value;

let words = document.getElementById("words").value;

document.getElementById("essayResult").value =

"Essay topic: " + topic +

"\n\nWord count: " + words +

"\n\nAI connection will be added here 🚀";

}

async function humanize(){

let text = document.getElementById("humanText").value;

document.getElementById("humanResult").value =

"Humanized text:\n\n" + text;

}

function changeColor(){

let color = document.getElementById("color").value;

document.body.style.background = color;

}

</script>

</body>

</html>
