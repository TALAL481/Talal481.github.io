<!DOCTYPE html>

<html>

<head>

<title>Useful Tools Hub</title>

<style>

body {

  background: black;

  color: white;

  font-family: Arial;

  text-align: center;

}

.box {

  background: #222;

  padding: 20px;

  margin: 20px;

  border-radius: 15px;

}

button {

  padding: 10px;

  margin: 5px;

  border-radius: 10px;

}

input {

  padding: 10px;

}

</style>

</head>

<body>

<h1>Useful Tools Hub 🚀</h1>

<div class="box">

<h2>⏱️ Stopwatch</h2>

<h3 id="time">00:00:000</h3>

<button onclick="start()">Start</button>

<button onclick="pause()">Pause</button>

<button onclick="reset()">Reset</button>

</div>

<div class="box">

<h2>🧮 Calculator</h2>

<input id="num1" placeholder="Number 1">

<input id="num2" placeholder="Number 2">

<br>

<button onclick="calc('+')">+</button>

<button onclick="calc('-')">-</button>

<button onclick="calc('*')">×</button>

<button onclick="calc('/')">÷</button>

<h3 id="answer">Answer:</h3>

</div>

<div class="box">

<h2>🔐 Password Generator</h2>

<button onclick="generatePassword()">Generate</button>

<h3 id="password"></h3>

</div>

<script>

let milliseconds = 0;

let timer = null;

function start(){

if(timer === null){

timer = setInterval(()=>{

milliseconds++;

let ms = milliseconds % 1000;

let seconds = Math.floor(milliseconds / 1000) % 60;

let minutes = Math.floor(milliseconds / 60000);

document.getElementById("time").innerHTML =

String(minutes).padStart(2,"0") + ":" +

String(seconds).padStart(2,"0") + ":" +

String(ms).padStart(3,"0");

},1);

}

}

function pause(){

clearInterval(timer);

timer = null;

}

function reset(){

pause();

milliseconds = 0;

document.getElementById("time").innerHTML="00:00:000";

}

function calc(op){

let a = Number(document.getElementById("num1").value);

let b = Number(document.getElementById("num2").value);

let result;

if(op=="+") result=a+b;

if(op=="-") result=a-b;

if(op=="*") result=a*b;

if(op=="/") result=a/b;

document.getElementById("answer").innerHTML="Answer: "+result;

}

function generatePassword(){

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890!@#$%";

let password="";

for(let i=0;i<12;i++){

password += chars[Math.floor(Math.random()*chars.length)];

}

document.getElementById("password").innerHTML=password;

}

</script>

</body>

</html>
