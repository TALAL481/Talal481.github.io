<!DOCTYPE html>

<html>

<head>

<title>Useful Tools Hub</title>

<style>

body {

  background: black;

  color: white;

  font-family: Arial;

  text-align: center;

}

.box {

  background: #222;

  padding: 20px;

  margin: 20px;

  border-radius: 15px;

}

button {

  padding: 10px;

  margin: 5px;

  border-radius: 10px;

  cursor: pointer;

}

input {

  padding: 10px;

  border-radius: 8px;

}

h1 {

  margin-top: 30px;

}

</style>

</head>

<body>

<h1>Useful Tools Hub 🚀</h1>

<div class="box">

<h2>⏱️ Stopwatch</h2>

<h3 id="time">00:00:000</h3>

<button onclick="start()">Start</button>

<button onclick="pause()">Pause</button>

<button onclick="reset()">Reset</button>

</div>

<div class="box">

<h2>🔐 Password Generator</h2>

<button onclick="password()">Generate Password</button>

<h3 id="pass"></h3>

</div>

<div class="box">

<h2>🎲 Random Number Generator</h2>

<button onclick="randomNumber()">Generate</button>

<h3 id="number"></h3>

</div>

<div class="box">

<h2>💡 Random Idea Generator</h2>

<button onclick="idea()">Generate Idea</button>

<h3 id="idea"></h3>

</div>

<div class="box">

<h2>💬 Random Quote Generator</h2>

<button onclick="quote()">Generate Quote</button>

<h3 id="quote"></h3>

</div>

<div class="box">

<h2>📝 Paragraph Generator</h2>

<input id="topic" placeholder="Topic">

<br><br>

<input id="lines" placeholder="Number of lines">

<br><br>

<button onclick="generateParagraph()">Generate</button>

<p id="paragraph"></p>

</div>

<script>

let startTime;

let elapsed = 0;

let timer = null;

function start(){

if(timer === null){

startTime = Date.now() - elapsed;

timer = setInterval(()=>{

elapsed = Date.now() - startTime;

let ms = elapsed % 1000;

let seconds = Math.floor(elapsed / 1000) % 60;

let minutes = Math.floor(elapsed / 60000);

document.getElementById("time").innerHTML =

String(minutes).padStart(2,"0") + ":" +

String(seconds).padStart(2,"0") + ":" +

String(ms).padStart(3,"0");

},10);

}

}

function pause(){

clearInterval(timer);

timer = null;

}

function reset(){

pause();

elapsed = 0;

document.getElementById("time").innerHTML="00:00:000";

}

function password(){

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890!@#$%";

let result="";

for(let i=0;i<12;i++){

result += chars[Math.floor(Math.random()*chars.length)];

}

document.getElementById("pass").innerHTML=result;

}

function randomNumber(){

document.getElementById("number").innerHTML =

Math.floor(Math.random()*1000);

}

function idea(){

let ideas=[

"Learn a new skill",

"Create a small project",

"Read a book",

"Exercise today",

"Try something creative"

];

document.getElementById("idea").innerHTML =

ideas[Math.floor(Math.random()*ideas.length)];

}

function quote(){

let quotes=[

"Keep going 🔥",

"Never stop learning",

"Small steps create big results",

"Make today count",

"Believe in yourself"

];

document.getElementById("quote").innerHTML =

quotes[Math.floor(Math.random()*quotes.length)];

}

function generateParagraph(){

let topic = document.getElementById("topic").value;

let lines = Number(document.getElementById("lines").value);

let text = "";

for(let i=0;i<lines;i++){

text += " " + topic + " is an interesting topic that people can learn about. Understanding this subject helps us gain knowledge and improve our skills.";

}

document.getElementById("paragraph").innerHTML = text;

}

</script>

</body>

</html>
