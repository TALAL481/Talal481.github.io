<!DOCTYPE html>

<html>

<head>

<title>AI Tools</title>

<style>

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: black;

  color: white;

  text-align: center;

}

h1 {

  margin-top: 20px;

}

.container {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 15px;

  padding: 20px;

}

.card {

  background: #111;

  border-radius: 15px;

  padding: 20px;

  border: 1px solid #333;

}

button {

  background: white;

  color: black;

  border: none;

  padding: 10px;

  border-radius: 10px;

  cursor: pointer;

}

input, textarea {

  width: 90%;

  padding: 10px;

  margin: 10px;

  border-radius: 10px;

  border: none;

}

#stopwatch {

  font-size: 35px;

}

</style>

</head>

<body>

<h1>AI Tools 🚀</h1>

<div class="container">

<div class="card">

<h2>⏱ Stopwatch</h2>

<div id="stopwatch">00:00:00.000</div>

<button onclick="startWatch()">Start</button>

<button onclick="stopWatch()">Stop</button>

<button onclick="resetWatch()">Reset</button>

</div>

<div class="card">

<h2>🔐 Password Generator</h2>

<p id="password">Your password</p>

<button onclick="generatePassword()">Generate</button>

</div>
<div class="card">

<h2>📝 Essay Generator</h2>

<input id="topic" placeholder="Enter essay topic">

<input id="words" placeholder="Number of words (max 3000)">

<button onclick="generateEssay()">Generate Essay</button>

<textarea id="essayOutput" rows="10" placeholder="Your essay appears here"></textarea>

</div>

<div class="card">

<h2>🤖 AI Humanizer</h2>

<textarea id="humanInput" rows="8" placeholder="Paste your text here"></textarea>

<button onclick="humanize()">Humanize</button>

<textarea id="humanOutput" rows="8" placeholder="Humanized text"></textarea>

</div>

<div class="card">

<h2>🎨 Background</h2>

<input type="color" id="bgColor">

<button onclick="changeBackground()">Change</button>

</div>

</div>

<script>

let startTime;

let timer;

let running = false;

let elapsed = 0;

function updateWatch(){

let time = Date.now() - startTime + elapsed;

let ms = time % 1000;

let sec = Math.floor(time/1000)%60;

let min = Math.floor(time/60000)%60;

document.getElementById("stopwatch").innerHTML =

String(min).padStart(2,"0")+":"+

String(sec).padStart(2,"0")+"."+

String(ms).padStart(3,"0");

}

function startWatch(){

if(!running){

startTime = Date.now();

timer = setInterval(updateWatch,10);

running=true;

}

}

function stopWatch(){

if(running){

clearInterval(timer);

elapsed += Date.now()-startTime;

running=false;

}

}

function resetWatch(){

clearInterval(timer);

elapsed=0;

running=false;

document.getElementById("stopwatch").innerHTML="00:00.000";

}

function generatePassword(){

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

let pass="";

for(let i=0;i<16;i++){

pass += chars[Math.floor(Math.random()*chars.length)];

}

document.getElementById("password").innerHTML=pass;

}
async function generateEssay(){

let topic = document.getElementById("topic").value;

let words = document.getElementById("words").value;

let response = await fetch("https://talal481-github-io-4.onrender.com/essay", {

  method: "POST",

  headers: {

    "Content-Type": "application/json"

  },

  body: JSON.stringify({

    topic: topic,

    words: words

  })

});

let data = await response.json();

document.getElementById("essayOutput").value = data.result;

}
let topic = document.getElementById("topic").value;

let words = document.getElementById("words").value;

document.getElementById("essayOutput").value =

"Generating essay about: " + topic + "\n\n" +

"Requested length: " + words + " words\n\n" +

"AI connection will be added next.";

}

async function humanize(){

let text = document.getElementById("humanInput").value;

document.getElementById("humanOutput").value =

"Humanized version:\n\n" + text;

}

function changeBackground(){

let color = document.getElementById("bgColor").value;

document.body.style.background = color;

}

</script>

</body>

</html>
