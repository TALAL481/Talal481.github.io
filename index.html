<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tools 🚀</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>AI Tools 🚀</h1>

<p>Your all-in-one productivity hub</p>

</header>

<main class="container">

<section class="card">

<h2>⏱ Stopwatch</h2>

<div id="timer">

00:00:00.000

</div>

<button id="startStop">Start</button>

<button id="reset">Reset</button>

</section>

<section class="card">

<h2>🔐 Password Generator</h2>

<p id="password">

Your password

</p>

<button id="generatePassword">

Generate

</button>

<button id="copyPassword">

Copy

</button>

</section>

<section class="card">

<h2>📝 AI Essay Generator</h2>

<input id="essayTopic" placeholder="Essay topic">

<input id="essayWords" placeholder="Word count">

<button id="generateEssay">

Generate Essay

</button>

<textarea id="essayOutput" placeholder="Your essay will appear here"></textarea>

<button id="copyEssay">

Copy Essay

</button>

</section>

<section class="card">

<h2>✨ AI Humanizer</h2>

<textarea id="humanInput" placeholder="Paste AI text here"></textarea>

<button id="humanize">

Humanize

</button>

<textarea id="humanOutput" placeholder="Humanized text"></textarea>

<button id="copyHuman">

Copy Result

</button>

</section>

<section class="card">

<h2>🎨 Theme</h2>

<input type="color" id="backgroundColor">

<button id="changeBackground">

Change Background

</button>

</section>

<section class="card">

<h2>🔥 More Tools Coming</h2>

<p>

More AI features will be added soon...

</p>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
